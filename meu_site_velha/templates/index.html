<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogo da Velha</title>
    <style>
        /* CSS: O Visual do Site */
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            text-align: center;
            margin-top: 50px;
        }

        /* O Tabuleiro usando Grid */
        .tabuleiro {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            justify-content: center;
            margin: 20px auto;
        }

        /* Cada casinha do tabuleiro */
        .casa {
            width: 100px;
            height: 100px;
            background-color: #282a36;
            font-size: 3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 10px;
            transition: background 0.3s;
        }

        .casa:hover {
            background-color: #44475a;
        }

        /* Cores diferentes para X e O */
        .X { color: #ff5555; }
        .O { color: #8be9fd; }
        
        /* Botão de reiniciar */
        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            background-color: #50fa7b;
            color: #282a36;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #40c863;
        }
    </style>
</head>
<body>

    <h1>Jogo da Velha</h1>
    <h2 id="mensagem">Vez do Jogador: X</h2>

    <div class="tabuleiro" id="tabuleiro"></div>

    <button onclick="reiniciarJogo()">Reiniciar Jogo</button>

    <script>
        /* JavaScript: A Lógica (Sua versão Python adaptada!) */
        
        // Nossa lista que guarda os valores, igual a sua matriz no Python
        let casas = ["", "", "", "", "", "", "", "", ""];
        let jogadorAtual = "X";
        let jogoAtivo = true;

        // O mesmo mapa de combinações que você fez!
        const combinacoesVencedoras = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Linhas
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Colunas
            [0, 4, 8], [2, 4, 6]             // Diagonais
        ];

        const divTabuleiro = document.getElementById("tabuleiro");
        const textoMensagem = document.getElementById("mensagem");

        // Função para desenhar o tabuleiro na tela
        function criarTabuleiro() {
            divTabuleiro.innerHTML = "";
            for (let i = 0; i < 9; i++) {
                let div = document.createElement("div");
                div.classList.add("casa");
                div.addEventListener("click", () => jogar(i, div));
                divTabuleiro.appendChild(div);
            }
        }

        // Função chamada quando alguém clica em uma casa
        function jogar(indice, elementoDiv) {
            // Se o jogo já acabou ou a casa já está ocupada, não faz nada
            if (!jogoAtivo || casas[indice] !== "") {
                return; 
            }

            // Marca a jogada na nossa lista e na tela
            casas[indice] = jogadorAtual;
            elementoDiv.innerText = jogadorAtual;
            elementoDiv.classList.add(jogadorAtual); // Adiciona cor ao X ou O

            verificarVencedor();
        }

        // Função com a lógica do seu all() para achar o ganhador
        function verificarVencedor() {
            let ganhou = false;

            for (let combo of combinacoesVencedoras) {
                let a = casas[combo[0]];
                let b = casas[combo[1]];
                let c = casas[combo[2]];

                // Se tiver casas vazias, ignora essa combinação
                if (a === "" || b === "" || c === "") {
                    continue;
                }

                // Se as 3 forem iguais, temos um vencedor!
                if (a === b && b === c) {
                    ganhou = true;
                    break;
                }
            }

            if (ganhou) {
                textoMensagem.innerText = `🏆 O Jogador ${jogadorAtual} Ganhou!`;
                jogoAtivo = false;
                return;
            }

            // Verifica se deu velha (empate)
            if (!casas.includes("")) {
                textoMensagem.innerText = "😲 Deu Velha! Empate!";
                jogoAtivo = false;
                return;
            }

            // Troca o turno
            jogadorAtual = jogadorAtual === "X" ? "O" : "X";
            textoMensagem.innerText = `Vez do Jogador: ${jogadorAtual}`;
        }

        // Função para limpar tudo
        function reiniciarJogo() {
            casas = ["", "", "", "", "", "", "", "", ""];
            jogadorAtual = "X";
            jogoAtivo = true;
            textoMensagem.innerText = "Vez do Jogador: X";
            criarTabuleiro();
        }

        // Inicia o jogo a primeira vez
        criarTabuleiro();
    </script>

</body>
</html>
